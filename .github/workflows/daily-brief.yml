name: 每日简报

on:
  workflow_dispatch:
  schedule:
    - cron: '3,16,25,43 23 * * *'
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: daily-brief-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 用 DeepSeek 生成今日简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$DEEPSEEK_API_KEY" ]]; then
            echo "未配置 DeepSeek 密钥，本次只初始化公开数据。"
            node generate.mjs --data-only
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node generate.mjs --refresh --force-refresh --data-only
          else
            node generate.mjs --refresh --data-only
          fi
      - name: 保存出刊记录
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/editions.json
          if ! git diff --cached --quiet; then
            git commit -m "更新每日简报"
            git push
          fi
